<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Nodes</title>
</head>
<body style="background-color: lightblue; color:black;">

</body>
<script>
    const div = document.createElement('div')
    console.log(div);
    div.className="main"
    div.id=Math.round(Math.random()*10+1)
    div.setAttribute('title','This is a div')
    div.style.backgroundColor="green"
    div.style.padding="12px"
    // div.innerHTML="<h1>This is a div created by JS</h1>"

    const text = document.createTextNode("This is a div created by JS")
    div.appendChild(text)

    document.body.appendChild(div)

</script>
</html>
